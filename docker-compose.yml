services:
  inventory-app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - inventory-data:/app/backend/data
    environment:
      - DATA_DIR=/app/backend/data
      - PORT=3000
      - NODE_ENV=production
      # Override with a long random string in real deployments
      - SESSION_SECRET=${SESSION_SECRET:-change-me-to-a-long-random-secret}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  inventory-data:
