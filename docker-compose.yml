services:
  inventory-app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - inventory-data:/app/backend/data
    environment:
      - DATA_DIR=/app/backend/data
      - PORT=3000
      - NODE_ENV=production
      # Override with a long random string in real deployments
      - SESSION_SECRET=${SESSION_SECRET:-change-me-to-a-long-random-secret}
      # Homelab Hub. Pairing stays private_only unless you knowingly allow public pair/start.
      # If Cloudflare Access protects this host, bypass /hub/v1 (see HUB.md).
      - HUB_PUBLIC_URL=${HUB_PUBLIC_URL:-}
      - HUB_TAILSCALE_URL=${HUB_TAILSCALE_URL:-}
      - HUB_JWT_SECRET=${HUB_JWT_SECRET:-}
      - HUB_PAIRING_NETWORK=${HUB_PAIRING_NETWORK:-private_only}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  inventory-data:
